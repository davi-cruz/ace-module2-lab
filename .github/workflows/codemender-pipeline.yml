name: CodeMender CI/CD Guardrail

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'lab/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write          # Create branch and commit patches
  pull-requests: write     # Open remediation PR
  id-token: write          # Mint OIDC token for WIF

env:
  SCAN_PATH: routes
  SCAN_FILES: "login.ts search.ts fileUpload.ts userProfile.ts dataErasure.ts"
  CM_BUNDLED: lab/bin/cm-linux
  CM_FIX_LIMIT: "3"

jobs:
  codemender-security:
    name: Scan, Identify, and Patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check WIF configuration
        run: |
          set -uo pipefail
          MISSING=""
          [ -n "${{ vars.GCP_WIF_PROVIDER }}" ]  || MISSING="$MISSING GCP_WIF_PROVIDER"
          [ -n "${{ vars.GCP_SA_EMAIL }}" ]      || MISSING="$MISSING GCP_SA_EMAIL"
          [ -n "${{ vars.GCP_QUOTA_PROJECT }}" ] || MISSING="$MISSING GCP_QUOTA_PROJECT"
          [ -n "${{ secrets.WIF_AUDIENCE }}" ]   || MISSING="$MISSING WIF_AUDIENCE(Secrets-tab)"
          if [ -n "$MISSING" ]; then
            echo "::error title=Missing WIF configuration::Not set:$MISSING. cm authenticates keylessly via Workload Identity Federation."
            exit 1
          fi
          echo "WIF configuration present."

      - name: Authenticate to Google Cloud (WIF / ADC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_QUOTA_PROJECT }}
          audience: ${{ secrets.WIF_AUDIENCE }}

      # -----------------------------------------------------------------------
      # Criterion 1: Clean cm install + init
      # -----------------------------------------------------------------------
      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          if [ ! -f "$CM_BUNDLED" ]; then
            echo "::error title=cm binary missing::$CM_BUNDLED not found in this repo."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cmbin"
          install -m 0755 "$CM_BUNDLED" "$RUNNER_TEMP/cmbin/cm"
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmbin/cm" --version || true

      - name: Initialize CodeMender Workspace (cm init)
        run: |
          set -uo pipefail
          cm init || true
          cm init --verify || echo "::warning::cm init --verify reported warnings."
          ls -la "$HOME/.codemender/" 2>/dev/null || echo "::warning::~/.codemender not found."

      - name: Narrow scan scope (park unscanned files)
        id: scope
        run: |
          set -euo pipefail
          PARK="$RUNNER_TEMP/parked-$(basename "$SCAN_PATH")"
          mkdir -p "$PARK"
          ADD_PATHS=""
          for F in $SCAN_FILES; do
            if [ ! -f "$SCAN_PATH/$F" ]; then
              echo "::error title=SCAN_FILES entry missing::$SCAN_PATH/$F does not exist."
              exit 1
            fi
            ADD_PATHS="${ADD_PATHS}${SCAN_PATH}/${F}"$'\n'
          done
          echo "park_dir=$PARK" >> "$GITHUB_OUTPUT"
          { echo "add_paths<<__CM_EOF__"; echo -n "$ADD_PATHS"; echo "__CM_EOF__"; } >> "$GITHUB_OUTPUT"
          KEPT=0; PARKED=0
          for P in "$SCAN_PATH"/*; do
            F="$(basename "$P")"
            case " $SCAN_FILES " in
              *" $F "*) KEPT=$((KEPT + 1)) ;;
              *)        mv "$P" "$PARK/"; PARKED=$((PARKED + 1)) ;;
            esac
          done
          echo "Scan scope: $KEPT file(s) kept in $SCAN_PATH/, $PARKED parked."

      - name: CodeMender Scan (cm find)
        id: scan
        run: |
          set -uo pipefail
          echo "Scanning '$SCAN_PATH'..."
          cm find "$SCAN_PATH" -y 2>&1 | tee "$RUNNER_TEMP/cm-find.cm.log"

      - name: Export Security Report (cm report -f json)
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        run: |
          set -uo pipefail
          cm report -f json > "$RUNNER_TEMP/cm-security-report.json" 2> "$RUNNER_TEMP/cm-report.err" || true
          echo "----- report preview -----"
          head -c 2048 "$RUNNER_TEMP/cm-security-report.json" || true
          echo

      # -----------------------------------------------------------------------
      # Criterion 3: Artifact generation (codemender-report)
      # -----------------------------------------------------------------------
      - name: Upload Security Report
        if: ${{ always() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: codemender-report
          path: ${{ runner.temp }}/cm-security-report.json
          if-no-files-found: warn

      - name: Triage Findings
        id: triage
        run: |
          python3 .github/scripts/cm_triage.py "$RUNNER_TEMP/cm-security-report.json"

      # Quick at-a-glance grading table in Actions Job Summary
      - name: Publish Triage Table to Job Summary
        if: ${{ always() && steps.triage.outcome == 'success' }}
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🔍 CodeMender Triage Summary

          | Metric | Count |
          |---|---|
          | **Total HIGH / CRITICAL Findings** | ${{ steps.triage.outputs.high_critical || 0 }} |
          | **Remediation Candidates (Top-N)** | ${{ steps.triage.outputs.fix_count || 0 }} |
          | **Target Finding IDs** | `${{ steps.triage.outputs.fix_ids || 'None' }}` |

          ### 📋 Planned Patches
          ${{ steps.triage.outputs.fix_summary || 'No actionable remediation targets identified.' }}
          EOF

      # -----------------------------------------------------------------------
      # Criterion 4: Autonomous Remediation (cm fix + multi-strategy patch apply)
      # -----------------------------------------------------------------------
      - name: Autonomous Remediation (cm fix, top-N)
        id: fix
        if: ${{ github.event_name != 'pull_request' && steps.triage.outputs.fix_ids != '' }}
        run: |
          set -uo pipefail
          echo "Remediating findings: ${{ steps.triage.outputs.fix_ids }}"
          for FID in ${{ steps.triage.outputs.fix_ids }}; do
            echo "::group::cm fix $FID"
            ( cd "$SCAN_PATH" && cm fix "$FID" -y --bypass-warning ) 2>&1 \
              | tee "$RUNNER_TEMP/fix-$FID.cm.log" || true

            python3 .github/scripts/extract_cm_diff.py "$RUNNER_TEMP/fix-$FID.cm.log" > "$RUNNER_TEMP/fix-$FID.patch" || true

            # Robust patch application: try relative to scan path and repo root
            if [ -s "$RUNNER_TEMP/fix-$FID.patch" ]; then
              if git apply --check -p1 --directory="$SCAN_PATH" "$RUNNER_TEMP/fix-$FID.patch" 2>/dev/null; then
                git apply -p1 --directory="$SCAN_PATH" "$RUNNER_TEMP/fix-$FID.patch"
                echo "Applied patch using -p1 --directory=$SCAN_PATH"
              elif git apply --check -p1 "$RUNNER_TEMP/fix-$FID.patch" 2>/dev/null; then
                git apply -p1 "$RUNNER_TEMP/fix-$FID.patch"
                echo "Applied patch using -p1 from repository root"
              elif ( cd "$SCAN_PATH" && git apply --check -p0 "$RUNNER_TEMP/fix-$FID.patch" 2>/dev/null ); then
                ( cd "$SCAN_PATH" && git apply -p0 "$RUNNER_TEMP/fix-$FID.patch" )
                echo "Applied patch using -p0 inside $SCAN_PATH"
              else
                echo "::warning title=Patch not applied::$FID patch failed dry-run check or was applied inline."
              fi
            else
              echo "No extracted patch found for $FID (cm may have written directly)."
            fi
            echo "::endgroup::"
          done

      - name: Restore unscanned files
        if: ${{ always() && steps.scope.outputs.park_dir != '' }}
        run: |
          set -euo pipefail
          PARK="${{ steps.scope.outputs.park_dir }}"
          find "$PARK" -mindepth 1 -maxdepth 1 -exec mv -t "$SCAN_PATH/" {} +
          rmdir "$PARK"
          echo "Restored parked files."

      - name: Verify Git Changes
        id: check_changes
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "----- Working Tree Status -----"
          git status --porcelain
          if [ -n "$(git status --porcelain -- "$SCAN_PATH")" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected changes in $SCAN_PATH ready for PR."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Changes Detected::Working tree clean; no patch was staged."
          fi

      - name: Open Remediation Pull Request
        id: pr
        if: ${{ github.event_name != 'pull_request' && steps.check_changes.outputs.has_changes == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codemender/auto-remediation
          delete-branch: true
          add-paths: |
            ${{ steps.scope.outputs.add_paths }}
          commit-message: |
            fix(security): CodeMender autonomous remediation

            Patches generated by `cm fix` for ${{ steps.triage.outputs.fix_count }} finding(s).
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "🤖 CodeMender: autonomous security remediation (${{ steps.triage.outputs.fix_count }} fix(es))"
          labels: |
            security
            automated
            codemender
          body: |
            ## 🤖 Autonomous remediation by CodeMender

            CodeMender's CI/CD guardrail scanned `${{ env.SCAN_PATH }}` and found
            **${{ steps.triage.outputs.high_critical }} HIGH/CRITICAL** finding(s).
            This PR auto-remediates the top **${{ steps.triage.outputs.fix_count }}** via `cm fix`:

            ${{ steps.triage.outputs.fix_summary }}

            ---
            Full report artifact: **`codemender-report`** on [run #${{ github.run_id }}](<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>).

      # -----------------------------------------------------------------------
      # Criterion 2: Pipeline gating (fail-safe on HIGH/CRITICAL)
      # -----------------------------------------------------------------------
      - name: Security Gate (fail on HIGH/CRITICAL)
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ steps.triage.outcome }}" != "success" ]; then
            echo "::error title=Deployment blocked::Security scan/triage did not complete successfully. Failing closed."
            exit 1
          fi
          COUNT="${{ steps.triage.outputs.high_critical }}"
          COUNT="${COUNT:-0}"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error title=Deployment blocked::CodeMender found $COUNT HIGH/CRITICAL finding(s). Failing the pipeline."
            exit 1
          fi
          echo "No HIGH/CRITICAL findings — security gate passed. ✅"